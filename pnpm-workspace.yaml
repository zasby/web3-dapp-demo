packages:
  - apps/*
  - packages/*

# Build scripts we skip: native addons with pure-JS fallbacks (pulled in by WalletConnect) and the
# anvil postinstall, which only re-downloads the binary that the platform package already ships.
allowBuilds:
  '@foundry-rs/anvil': false
  bufferutil: false
  keccak: false
  utf-8-validate: false
